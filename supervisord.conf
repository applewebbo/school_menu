[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:web]
command=/app/.venv/bin/granian core.wsgi:application --host 0.0.0.0 --port 80 --interface wsgi --no-ws --loop uvloop --process-name "granian [core]" --workers 2 --backpressure 16
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/granian.log
stderr_logfile=/app/logs/granian.err.log

[program:worker]
command=/app/.venv/bin/python manage.py qcluster
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/qcluster.log
stderr_logfile=/app/logs/qcluster.err.log
