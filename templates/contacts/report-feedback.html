{% load crispy_forms_tags filters heroicons %}
<div class="modal-content">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-3 pb-4 md:p-4">
        <h3 id="report-feedback-title"
            data-modal-title
            class="text-base-content text-xl font-semibold">Segnalazioni</h3>
        <button type="button"
                class="text-base-content/50 hover:bg-base-200 hover:text-base-content ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm"
                x-on:click="openModal = false">
            {% heroicon_solid 'x-mark' class="size-7" %}
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="px-5 py-3 md:px-6 md:py-4">
        <p class="text-base-content/70 mb-4 text-sm">
            Rispondi alla segnalazione ricevuta compilando il form sottostante.
        </p>
        <form method="post" action="{% url 'contacts:report_feedback' report.pk %}">
            {% crispy form %}
            <div class="flex items-center justify-between gap-2">
                <button class="btn btn-sm dark:btn-soft mt-2 flex items-center"
                    hx-get="{% url 'contacts:report_detail' report.pk %}"
                    hx-target="#dialog"
                    hx-swap="innerHTML"
                    @click="$dispatch('open-modal')">
                {% heroicon_outline 'arrow-left' class='size-5' %}Indietro</button>
                <button type="submit"
                        name="submit"
                        class="btn btn-sm btn-primary mt-2">
                    Invia Messaggio
                </button>
            </div>
        </form>
    </div>
</div>
