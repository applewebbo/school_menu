{% load filters heroicons %}
<div class="modal-content">
    <div class="flex items-center justify-between rounded-t border-b p-3 pb-4 md:p-4 dark:border-gray-600">
        <h3 id="report-list-title"
            data-modal-title
            class="text-xl font-semibold text-gray-900 dark:text-white">Segnalazioni</h3>
        <button type="button"
                class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            {% heroicon_solid 'x-mark' class="size-7" %}
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    {% if reports %}
    <div class="m-4 overflow-x-auto">
        <table class="table text-center">
            <!-- head -->
            <thead>
                <tr>
                    <th>Mittente</th>
                    <th>Ricevuto</th>
                    <th class="hidden md:block">Scadenza</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                {% for report in reports %}
                    <tr>
                        <td>{{ report.name }}</td>
                        <td>{{ report.created_at|date:"d.m.y" }}</td>
                        <td class="hidden md:block">{{ report.created_at|days }}</td>
                        <td>
                            <div class="flex justify-center gap-2" x-data>
                                <button class="btn btn-xs btn-default flex items-center"
                                        hx-get="{% url 'contacts:report_detail' report.pk %}"
                                        hx-target="#dialog"
                                        hx-swap="innerHTML"
                                        @click="$dispatch('open-modal')">
                                    {% heroicon_mini 'eye' class='size-4' %} <span class="hidden md:block">Visualizza</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="p-4 md:p-8">
        <p class="text-center text-gray-500">Nessuna segnalazione ricevuta</p>
    </div>
    {% endif %}
</div>
