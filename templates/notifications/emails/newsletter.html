<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #ebebeb;">
            <tr>
              <td style="background-color:#2e8401; padding:20px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td width="36" style="vertical-align:middle;">
                      <img src="{{ logo_url }}" width="28" height="28" alt="" style="display:block; border-radius:6px;">
                    </td>
                    <td style="vertical-align:middle; padding-left:10px;">
                      <p style="margin:0; color:#ffffff; font-size:17px; font-weight:700;">Menù Scolastico</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                {{ body_html|safe }}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px; border-top:1px solid #ebebeb;">
                <p style="margin:0; color:#9ca3af; font-size:12px; line-height:1.5;">
                  Ricevi questa email perché sei registrato su Menù Scolastico.
                  <a href="{{ unsubscribe_url }}" style="color:#9ca3af; text-decoration:underline;">Annulla l'iscrizione alla newsletter</a>.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
