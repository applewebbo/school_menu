{% load crispy_forms_tags %}
<div class="bg-base-200 rounded-lg p-4">
    <p class="mb-3 text-base/5">Modifica impostazioni notifiche</p>
    <form class="flex flex-col gap-4"
          hx-post="{% url 'notifications:change_school' %}"
          hx-target="#test-notification-result"
          hx-swap="innerHTML">
        {% csrf_token %}
        {% crispy form %}
        <button class="btn btn-sm btn-primary btn-outline self-start" type="submit">Salva</button>
    </form>
</div>
