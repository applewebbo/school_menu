{% load crispy_forms_tags %}

<form id="school-select-form"
      hx-post="{% url 'notifications:save_subscription' %}"
      hx-target="this"
      hx-swap="outerHTML"
      x-data="{ selectedSchool: null, schoolsWithAlt: {{ schools_with_alt_menus|default:'[]' }} }"
      x-init="selectedSchool = $el.querySelector('#id_school')?.value"
      @change.capture="if ($event.target.id === 'id_school') selectedSchool = $event.target.value">
    {% csrf_token %}
    {{ form.subscription_info }}
    <div>
        <label for="{{ form.school.id_for_label }}" class="select w-full">
            <span class="label">{{ form.school.label }}</span>
            {{ form.school }}
        </label>
        {% for error in form.school.errors %}
            <p class="text-error text-xs italic">{{ error }}</p>
        {% endfor %}
    </div>
    <div class="mt-4" x-show="schoolsWithAlt.includes(Number(selectedSchool))">
        <label for="{{ form.meal_type.id_for_label }}" class="select w-full">
            <span class="label">{{ form.meal_type.label }}</span>
            {{ form.meal_type }}
        </label>
        {% for error in form.meal_type.errors %}
            <p class="text-error text-xs italic">{{ error }}</p>
        {% endfor %}
    </div>
    <div class="mt-4">
        <label for="{{ form.notification_time.id_for_label }}" class="select w-full">
            <span class="label">{{ form.notification_time.label }}</span>
            {{ form.notification_time }}
        </label>
        {% for error in form.notification_time.errors %}
            <p class="text-error text-xs italic">{{ error }}</p>
        {% endfor %}
    </div>
    <div class="mt-4 flex flex-col sm:flex-row sm:justify-end">
        <button type="button"
                class="btn btn-primary btn-soft"
                x-data="pushNotifications"
                x-init="enabled = false"
                x-bind:disabled="subscribing"
                @click="subscribeAndSubmit($el.form, '{{ vapid_public_key }}')">
            <span x-show="!subscribing">Abilita notifiche</span>
            <span x-show="subscribing">Abilitazione...</span>
        </button>
    </div>
</form>
