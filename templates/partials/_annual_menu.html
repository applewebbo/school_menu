{% if meal.is_active %}
<div>
    <p class="text-base-content/60 mb-1 text-sm font-semibold tracking-wide uppercase">Pranzo</p>
    <p>{{ meal.menu|default:"-"|linebreaks }}</p>
</div>
<div>
    <p class="text-base-content/60 mb-1 text-sm font-semibold tracking-wide uppercase">Merenda</p>
    <p>{{ meal.snack|default:"-" }}</p>
</div>
{% else %}
<p class="p-12 text-xl font-medium text-gray-900">
    <em>Nessun menù caricato per il giorno selezionato</em>
</p>
{% endif %}
