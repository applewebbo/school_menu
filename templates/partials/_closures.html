{% load heroicons %}
<div class="col-span-1 grid grid-cols-1 gap-y-2 md:col-span-2"
     id="closures"
     x-data
     {% if oob %}hx-swap-oob="true"{% endif %}>
    <div class="mb-2 flex flex-col items-center gap-2 sm:flex-row sm:justify-between">
        <div class="flex items-center justify-center sm:justify-start">
            <h4 class="text-lg font-bold tracking-tight">Chiusure Straordinarie</h4>
            <span class="badge badge-sm badge-neutral badge-outline ms-2">{{ closures.count }}/5</span>
        </div>
        {% if can_add_closure %}
            <button class="btn btn-xs btn-outline btn-secondary dark:btn-soft hidden items-center justify-center sm:inline-flex"
                    hx-get="{% url 'school_menu:closure_create' %}"
                    hx-target="#dialog"
                    hx-swap="innerHTML"
                    @click="$dispatch('open-modal')">
                {% heroicon_mini 'plus' class="size-3 me-1" %}
                Aggiungi Chiusura
            </button>
        {% endif %}
    </div>
    <div class="grid grid-cols-1 gap-x-4 gap-y-2 sm:grid-cols-2">
        {% for closure in closures %}
            <div class="flex items-center">
                <h5 class="mr-8 grow font-medium md:grow-0">{{ closure.date|date:"d/m/Y" }}</h5>
                <button class="btn btn-xs btn-outline btn-error group dark:btn-soft inline-flex items-center"
                        hx-delete="{% url 'school_menu:closure_delete' closure.pk %}"
                        hx-confirm="Confermi l'eliminazione della chiusura del {{ closure.date|date:'d/m/Y' }}?"
                        hx-target="#closures"
                        hx-swap="outerHTML">
                    Elimina
                    {% heroicon_mini 'trash' class="group-hover:text-white text-error size-3" %}
                </button>
            </div>
        {% endfor %}
    </div>
    {% if can_add_closure %}
        <button class="btn btn-xs btn-outline btn-secondary dark:btn-soft inline-flex w-full items-center justify-center sm:hidden"
                hx-get="{% url 'school_menu:closure_create' %}"
                hx-target="#dialog"
                hx-swap="innerHTML"
                @click="$dispatch('open-modal')">
            {% heroicon_mini 'plus' class="size-3 me-1" %}
            Aggiungi Chiusura
        </button>
    {% else %}
        <p class="text-base-content/70 text-sm italic">Limite massimo di chiusure raggiunto.</p>
    {% endif %}
</div>
