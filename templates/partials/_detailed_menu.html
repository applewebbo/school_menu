<div>
    <p class="text-base-content/60 mb-1 text-sm font-semibold tracking-wide uppercase">Pranzo</p>
    <ul class="menu-list list-unstyled">
        <li class="sentence-case">{{ meal.first_course }}</li>
        <li class="sentence-case">{{ meal.second_course }}</li>
        <li class="sentence-case">{{ meal.side_dish }}</li>
        <li class="sentence-case">{{ meal.fruit }}</li>
    </ul>
</div>
{% if meal.snack %}
<div>
    <p class="text-base-content/60 mb-1 text-sm font-semibold tracking-wide uppercase">Spuntino</p>
    <ul class="menu-list list-unstyled">
        <li class="sentence-case">{{ meal.snack }}</li>
    </ul>
</div>
{% endif %}
