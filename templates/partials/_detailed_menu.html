{% if meal.snack %}
<p class="my-3 text-xl font-medium">
    <strong>Pranzo</strong>
</p>
{% else %}
<div class="py-3"></div>
{% endif %}
<ul class="menu-list list-unstyled">
    <li>{{ meal.first_course }}</li>
    <li>{{ meal.second_course }}</li>
    <li>{{ meal.side_dish }}</li>
    <li>{{ meal.fruit }}</li>
</ul>
{% if meal.snack %}
<p class="my-3 text-xl font-medium">
    <strong>Spuntino</strong>
</p>
<ul class="menu-list mb-4 list-unstyled">
    <li>{{ meal.snack }}</li>
</ul>
{% else %}
<div class="mb-4 py-3"></div>
{% endif %}
