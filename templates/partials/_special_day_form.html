{% load crispy_forms_tags heroicons %}
<form method="post"
      hx-post="{{ request.path }}"
      hx-swap="innerHTML"
      hx-target="#dialog"
      hx-disabled-elt="#form-submit"
      hx-indicator="#spinner"
      class="modal-content">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-3 pb-4 md:p-4">
        <h3 id="special-day-form-title"
            data-modal-title
            class="text-base-content text-xl font-semibold">
            Aggiungi Giorno Speciale
        </h3>
        <button type="button"
                class="text-base-content/50 hover:bg-base-200 hover:text-base-content ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm"
                x-on:click="openModal = false">
            {% heroicon_solid 'x-mark' class="size-7" %}
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="mt-3 px-5 py-3 md:px-6 md:py-4">
        {% crispy form %}
    </div>
    <div class="flex items-center justify-end gap-3 px-5 pb-3 md:px-6 md:pb-4">
        <div id="spinner"
             class="loading loading-bars loading-md text-primary htmx-indicator"></div>
        <button type="submit" id="form-submit" class="btn btn-primary">Salva</button>
        <button type="button" class="btn btn-outline" x-on:click="openModal = false">Annulla</button>
    </div>
</form>
