<div x-data="{
        openModal: false,
        modalTitleId: null,
        init() {
            this.$watch('openModal', value => {
                if (value) {
                    this.$nextTick(() => {
                        document.getElementById('dialog')?.focus();
                    });
                }
            });
        }
     }"
     x-cloak
     @open-modal.window="openModal = true"
     @hide-modal.window="openModal = false; modalTitleId = null">
     <div x-show="openModal"
          x-on:keydown.escape.prevent.stop="openModal = false; modalTitleId = null"
          role="dialog"
          aria-modal="true"
          :aria-labelledby="modalTitleId"
          class="fixed inset-0 z-50 overflow-y-auto">
          <!-- Overlay -->
          <div x-show="openModal"
               x-transition.opacity
               class="fixed inset-0 bg-black/70"></div>
          <!-- Panel -->
          <div x-show="openModal"
               x-transition
               x-on:click="openModal = false; modalTitleId = null"
               class="p4 relative flex min-h-screen items-center justify-center">
               <div x-on:click.stop
                    x-trap.noscroll.inert="openModal"
                    id="dialog"
                    tabindex="-1"
                    @htmx:after-swap.camel="modalTitleId = $el.querySelector('[data-modal-title]').id"
                    class="bg-base-100 relative w-full max-w-2xl overflow-y-auto rounded-lg shadow outline-none"></div>
          </div>
     </div>
</div>
