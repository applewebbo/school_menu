<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controllo utenti inattivi</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#fcfcfc; border-radius:12px; overflow:hidden; border:1px solid #ebebeb;">
            <tr>
              <td style="background-color:#2e8401; padding:28px 32px;">
                <p style="margin:0; color:#ffffff; font-size:13px; letter-spacing:.04em; text-transform:uppercase; opacity:.85;">menuscolastico.it</p>
                <h1 style="margin:6px 0 0; color:#ffffff; font-size:22px; font-weight:700;">Controllo Utenti Inattivi</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:14px 16px; background-color:#f5f5f5; border-radius:8px;">
                      <p style="margin:0; color:#4b5563; font-size:13px;">Utenti totali</p>
                      <p style="margin:2px 0 0; color:#1f2937; font-size:24px; font-weight:700;">{{ total_users }}</p>
                    </td>
                  </tr>
                  <tr><td style="height:12px; line-height:12px;">&nbsp;</td></tr>
                  <tr>
                    <td style="padding:14px 16px; background-color:#f5f5f5; border-radius:8px;">
                      <p style="margin:0; color:#4b5563; font-size:13px;">Utenti cancellati (13+ mesi di inattività)</p>
                      <p style="margin:2px 0 0; color:#b91c1c; font-size:24px; font-weight:700;">{{ deleted_count }}</p>
                    </td>
                  </tr>
                  <tr><td style="height:12px; line-height:12px;">&nbsp;</td></tr>
                  <tr>
                    <td style="padding:14px 16px; background-color:#f5f5f5; border-radius:8px;">
                      <p style="margin:0; color:#4b5563; font-size:13px;">Utenti avvisati (12 mesi di inattività)</p>
                      <p style="margin:2px 0 0; color:#f67d00; font-size:24px; font-weight:700;">{{ notified_count }}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 28px;">
                <p style="margin:0; color:#4b5563; font-size:11px; border-top:1px solid #ebebeb; padding-top:16px;">
                  Controllo automatico periodico sugli account inattivi.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
