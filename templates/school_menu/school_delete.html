{% load heroicons static %}
<div class="modal-content">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-3 pb-4 md:p-4">
        <h3 id="school-delete-title"
            data-modal-title
            class="text-base-content text-xl font-semibold">Elimina la tua scuola</h3>
        <button type="button"
                class="text-base-content/50 hover:bg-base-200 hover:text-base-content ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm"
                x-on:click="openModal = false">
            {% heroicon_solid 'x-mark' class="size-7" %}
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="mt-3 grid gap-x-8 gap-y-4 px-5 py-3 md:px-6 md:py-4">
        <p class="text-base-content/70 text-sm">
            Sei sicuro di voler eliminare <strong>{{ school.name }}</strong>? Questa azione cancellerà anche tutti i menu associati.
        </p>
        <form hx-post="{% url 'school_menu:school_delete' %}"
              hx-target="#school"
              hx-swap="outerHTML">
            <button type="submit" class="btn btn-error btn-block mb-4">Elimina Scuola</button>
        </form>
        <div class="alert alert-warning" role="alert">
            {% heroicon_solid 'exclamation-triangle' class="size-5 min-w-5" %}
            <span class="text-sm italic">Attenzione, l'eliminazione della scuola è immediata e definitiva.</span>
        </div>
    </div>
</div>
