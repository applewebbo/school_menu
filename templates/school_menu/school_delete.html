{% load heroicons static %}
<div class="modal-content">
    <div class="flex items-center justify-between rounded-t border-b p-3 pb-4 md:p-4 dark:border-gray-600">
        <h3 id="school-delete-title"
            data-modal-title
            class="text-xl font-semibold text-gray-900 dark:text-white">Elimina la tua scuola</h3>
        <button type="button"
                class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            {% heroicon_solid 'x-mark' class="size-7" %}
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="mt-3 grid gap-x-8 gap-y-4 px-5 py-3 md:px-6 md:py-4">
        <p class="text-sm text-gray-500">
            Sei sicuro di voler eliminare <strong>{{ school.name }}</strong>? Questa azione cancellerà anche tutti i menu associati.
        </p>
        <form hx-post="{% url 'school_menu:school_delete' %}"
              hx-target="body">
            <button type="submit" class="btn btn-error btn-block mb-4">Elimina Scuola</button>
        </form>
        <div class="m-auto mb-4 flex items-center rounded border border-red-200 bg-red-50 px-6 py-2 text-red-800">
            {% heroicon_solid 'exclamation-triangle' class="size-5 me-4 min-w-5" %}
            <span class="text-sm italic">Attenzione, l'eliminazione della scuola è immediata e definitiva.</span>
        </div>
    </div>
</div>
